<!-- -- AI GENERATED CODE (deepseek-v4.1-flash) :: (2026-10-25) harness:openlumara
   editor module tool views: read/write/append/create (code block), edit
   (diff), grep (grouped matches), path (glob list + move/copy/delete/
   mkdir one-liner), media (read_media image, fetched from the module route),
   outline (symbol/heading map as a monospace box) and block (replace_block /
   insert_block: target + the NEW block ONLY - never the text being replaced,
   which would cost context). fills the "tool_views" slot of the webui's
   templates/chat/tool_displays.html via the extension system: the core
   template calls extension_slot("tool_views"), which renders this macro
   because the file mirrors the caller's relative path (chat/tool_displays.html).
   markup is pure Alpine: `tool` + `cacheKey` come from the card's x-data
   scope (chat/toolcalls.html), not from jinja. helpers live in
   assets/js/tool_view_helpers.js (editor-prefixed: coder may be enabled at
   the same time and its own generic globals already exist), styling in
   assets/css/custom_tool_views/. -->
{% macro tool_views() %}

<template x-if="toolDisplayView(tool) === 'editor-code'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get code() {
                        if (this.response?.status === 'error') return '';
                        const c = this.response?.content;
                        if (c && typeof c === 'object') return c.content ?? '';
                        return this.args.content ?? '';
                    },
                    get html() { return codeLinesHtml(this.code, editorLangForPath(this.args.path), this.args.line_start, cacheKey) } }">
    <div>
        <div class="file-read-box hljs" x-show="html" x-auto-scroll x-fade-html="html"></div>
        <div class="grep-note" x-show="response?.content?.truncation_note" x-text="response?.content?.truncation_note ?? ''"></div>
        <div class="grep-note" x-show="response?.content?.char_truncation_note" x-text="response?.content?.char_truncation_note ?? ''"></div>
        <div class="display-footer" x-show="args.path" x-text="args.path"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'editor-edit'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get html() { return editorDiffHtml(this.args.original_code, this.args.replacement_code, editorLangForPath(this.args.path), cacheKey) },
                    get sideHtml() { return editorDiffSideHtml(this.args.original_code, this.args.replacement_code, editorLangForPath(this.args.path), cacheKey) } }">
    <div class="diff-container">
        <div class="tool-display hljs diff-unified" x-show="html" x-auto-scroll x-fade-html="html"></div>
        <div class="diff-side hljs" x-show="sideHtml" x-auto-scroll x-fade-html="sideHtml"></div>
        <div class="display-footer" x-show="args.path" x-text="args.path"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'editor-grep'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get groups() { return editorGrepGroups(this.response, this.args) } }">
    <div>
        <div class="grep-running" x-show="!response">
            <span class="grep-running-label">searching</span>
            <span class="grep-running-pattern" x-show="args.regex_pattern" x-text="args.regex_pattern"></span>
            <span class="grep-running-label" x-show="args.regex_pattern && (args.workspace || args.sub_path)">in</span>
            <span class="grep-running-pattern" x-show="args.workspace || args.sub_path"
                  x-text="(args.workspace ? args.workspace + ': ' : '') + (args.sub_path ?? '')"></span>
        </div>
        <div class="grep-results" x-show="groups.length">
            <template x-for="g in groups">
                <div class="grep-file">
                    <div class="grep-file-name" x-text="g.file"></div>
                    <div class="grep-box">
                        <template x-for="row in editorGrepRows(g.matches)">
                            <div class="grep-line" :class="'grep-' + row.kind">
                                <span class="grep-num" x-text="row.num"></span>
                                <span class="grep-text" x-text="row.text"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
        <div class="grep-note" x-show="response?.content?.note" x-text="response?.content?.note ?? ''"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'editor-media'"
          x-data="{ src: '', loaded: '', err: '',
                    load() {
                        const r = toolResponse(tool)?.content;
                        // only fetch when an image was actually attached: videos,
                        // non-media files and oversize/attach=false results carry a note
                        if (!r?.path || r.note || !String(r.mime_type ?? '').startsWith('image/')) return;
                        const key = r.path + ':' + r.size_bytes;
                        if (key === this.loaded) return;
                        this.loaded = key;
                        this.err = '';
                        const a = toolArgs(tool, cacheKey) ?? {};
                        const qs = new URLSearchParams({ workspace: a.workspace ?? '', path: r.path });
                        simpleApiFetch('/api/ext/editor/media?' + qs)
                            .then(j => { this.src = 'data:' + j.mime + ';base64,' + j.b64; })
                            .catch(e => {
                                this.err = (typeof e === 'string' && e) || e?.message
                                           || 'could not load the image';
                                this.loaded = '';   // allow a retry on the next effect run
                            });
                    } }"
          x-effect="load()">
    <div class="media-attach">
        <template x-if="src">
            <img class="media-attach-thumb" :src="src" loading="lazy" alt="attached image">
        </template>
        <div class="media-attach-path" x-show="toolResponse(tool)?.content?.path"
             x-text="toolResponse(tool)?.content?.path"></div>
        <div class="display-error" x-show="err" x-text="err"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'editor-path'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    get path() { return this.args.path ?? this.args.orig_path ?? this.args.sub_path ?? '' },
                    get files() { return editorGlobFiles(this.response) } }">
    <div>
        <div class="grep-running" x-show="!response">
            <span class="grep-running-pattern" x-show="path" x-text="path"></span>
            <span class="grep-running-label" x-show="args.target_path">-&gt;</span>
            <span class="grep-running-pattern" x-show="args.target_path" x-text="args.target_path"></span>
        </div>
        <div class="glob-files" x-show="files.length">
            <template x-for="f in files">
                <div class="glob-file" x-text="f"></div>
            </template>
        </div>
        <div class="grep-note" x-show="response?.content?.note" x-text="response?.content?.note ?? ''"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'editor-outline'"
          x-data="{ get response() { return toolResponse(tool) },
                    get map() {
                        // the symbol/heading/key map is plain text. a capped map
                        // comes back wrapped ({content, truncated,
                        // truncation_note} - the shape read uses), and checking
                        // only for a string left that box empty
                        const content = this.response?.content;
                        if (typeof content === 'string') return content;
                        return typeof content?.content === 'string' ? content.content : '';
                    },
                    get note() {
                        const content = this.response?.content;
                        if (typeof content === 'string') return '';
                        return content?.truncation_note ?? content?.note ?? content?.error ?? '';
                    } }">
    <div>
        <!-- render it as a monospace box, not as a json string with escaped
             newlines; NOTE: sibling getters need `this.` (see editor-block) -->
        <div class="file-read-box" x-show="map" x-text="map"></div>
        <div class="grep-note" x-show="note" x-text="note"></div>
        <div class="display-footer" x-text="toolArgs(tool, cacheKey)?.path ?? ''"></div>
    </div>
</template>

<template x-if="toolDisplayView(tool) === 'editor-block'"
          x-data="{ get args() { return toolArgs(tool, cacheKey) },
                    get response() { return toolResponse(tool) },
                    snap: null, pre: null, asked: '',
                    get verb() {
                        // NOTE: a sibling getter is only reachable through `this`
                        // inside an x-data object literal - a bare `args` here is
                        // a ReferenceError and leaves the label empty.
                        if (toolDisplayName(tool) !== 'editor_insert_block') return 'replacing';
                        return 'inserting ' + (this.args.where === 'after' ? 'after' : 'before');
                    },
                    get html() { return editorBlockHtml(this.args.content, editorLangForPath(this.args.path), cacheKey) },
                    get token() {
                        // the tool ends its result with a marker plus a hex token
                        // (one per call), so every card keeps its own before-block
                        // and a repeated edit cannot show someone else's snapshot
                        const m = String(this.response?.content ?? '').match(/#([0-9a-f]{8,32})/);
                        return m ? m[1] : '';
                    },
                    get diffHtml() {
                        const s = this.snap;
                        if (!s || !s.old) return '';
                        return editorDiffHtml(s.old, s.new ?? '', editorLangForPath(this.args.path), cacheKey + ':b');
                    },
                    get diffSideHtml() {
                        // the container is a size container: CSS shows the side
                        // layout above 640px and the unified one below, so both
                        // must exist - rendering only the unified left the box
                        // empty at normal chat widths
                        const s = this.snap;
                        if (!s || !s.old) return '';
                        return editorDiffSideHtml(s.old, s.new ?? '', editorLangForPath(this.args.path), cacheKey + ':b');
                    },
                    get liveActive() { return !this.snap && !!this.pre; },
                    get liveDiffHtml() {
                        // the before side comes from the FILE (fetched), the after
                        // side is the argument still streaming - the same diff
                        // renderer the edit card uses, re-run as it arrives
                        if (!this.liveActive) return '';
                        return editorDiffHtml(this.pre.old ?? '', this.args.content ?? '',
                                              editorLangForPath(this.args.path), cacheKey + ':live');
                    },
                    get liveDiffSideHtml() {
                        if (!this.liveActive) return '';
                        return editorDiffSideHtml(this.pre.old ?? '', this.args.content ?? '',
                                                  editorLangForPath(this.args.path), cacheKey + ':live');
                    },
                    load() {
                        // an insertion has no before-block to show
                        if (toolDisplayName(tool) === 'editor_insert_block') return;
                        const token = this.token;
                        const chat = Alpine.store('chat')?.chat?.id;
                        if (token) {
                            // the call is done: its own snapshot is the truth, and
                            // the file already holds the new text, so drop the live one
                            if (!chat) return;
                            const key = chat + '|' + token;
                            if (key === this.asked) return;
                            this.asked = key;
                            simpleApiFetch('/api/ext/editor/block?' + new URLSearchParams({ chat, token }))
                                .then(j => {
                                    this.snap = (j && j.old !== undefined)
                                        ? { old: j.old, new: j.new } : null;
                                    this.pre = null;
                                })
                                .catch(() => { this.snap = null; });
                            return;
                        }
                        // still streaming: nothing has been written yet, so the
                        // file itself still holds the pre-edit block - fetch it
                        // once as soon as workspace, path and target are in
                        const tgt = this.args.target;
                        if (!tgt || !this.args.path) return;
                        const preKey = ['pre', this.args.workspace ?? '', this.args.path, tgt].join('|');
                        if (preKey === this.asked) return;
                        this.asked = preKey;
                        const qs = new URLSearchParams({
                            workspace: this.args.workspace ?? '', path: this.args.path, target: tgt });
                        simpleApiFetch('/api/ext/editor/block-preview?' + qs)
                            .then(j => {
                                // a late response must not resurrect the live pane
                                if (!this.token && j && j.old !== undefined) this.pre = j;
                            })
                            .catch(() => { this.pre = null; });
                    } }"
          x-effect="load()">
    <div>
        <div class="block-head">
            <span class="grep-running-label" x-text="verb"></span>
            <span class="grep-running-pattern" x-show="args.target" x-text="args.target ?? ''"></span>
        </div>
        <!-- a snapshot turns the card into a real before/after diff, rendered by
             the same helpers the edit card uses; it comes from a module route,
             never from the tool result, so the old text costs no context -->
        <div class="diff-container" x-show="diffHtml">
            <div class="tool-display hljs diff-unified" x-show="diffHtml" x-auto-scroll x-fade-html="diffHtml"></div>
            <div class="diff-side hljs" x-show="diffSideHtml" x-auto-scroll x-fade-html="diffSideHtml"></div>
        </div>
        <!-- while the call streams, the before side is the block the FILE still
             holds (fetched through the module, since it is not in the arguments),
             so the same diff renderer can run live as the replacement arrives;
             the snapshot diff takes over the moment the call completes -->
        <div class="diff-container" x-show="liveActive">
            <div class="tool-display hljs diff-unified" x-show="liveDiffHtml" x-auto-scroll x-fade-html="liveDiffHtml"></div>
            <div class="diff-side hljs" x-show="liveDiffSideHtml" x-auto-scroll x-fade-html="liveDiffSideHtml"></div>
        </div>
        <div class="file-read-box hljs" x-show="!diffHtml && !liveActive && html" x-auto-scroll x-fade-html="html"></div>
        <!-- the tool's own result line: "was lines 12-40", "had no body", ... -->
        <div class="grep-note" x-show="response?.content" x-text="response?.content ?? ''"></div>
        <div class="display-footer" x-show="args.path" x-text="args.path ?? ''"></div>
    </div>
</template>

{% endmacro %}
