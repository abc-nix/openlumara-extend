{# ================= E10 prompt processing & streaming ================= #}
<section class="tg-el-section">
    <h3>Prompt processing &amp; streaming</h3>
    <div class="prompt-processing-indicator-wrapper pp-prompt">
        <div class="prompt-processing-indicator">
            <div class="progress-header">
                <span class="prompt-processing-percent">42%</span>
                <span class="prompt-processing-eta">Processing prompt… (ETA: 12s)</span>
            </div>
            <div class="prompt-progress-bar"><div class="prompt-progress-bar-fill" style="width:42%"></div></div>
        </div>
    </div>
    <div class="prompt-processing-indicator-wrapper pp-tool">
        <div class="prompt-processing-indicator">
            <div class="progress-header">
                <span class="prompt-processing-percent">78%</span>
                <span class="prompt-processing-eta">tool variant (bare)</span>
            </div>
            <div class="prompt-progress-bar"><div class="prompt-progress-bar-fill" style="width:78%"></div></div>
        </div>
    </div>
    <div class="tg-el-row"><div class="streaming-indicator"><span class="indicator-dot"></span><span class="indicator-dot"></span><span class="indicator-dot"></span></div>
        <span class="stop-text">Click to stop • 128 tokens</span>
        <span class="tg-el-cap">prompt_processing.css + input.css (.streaming-indicator, .stop-text)</span></div>
</section>
