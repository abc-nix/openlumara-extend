{# chat-pro - the header icon (right panel toggle). a framed panel with the side
   column filled: reads as "the panel is here" at 16px, and the slab carries a
   class so the button's open state can tint it. use with the standard header
   button: <button class="btn">{% include 'chat-pro/svg/chatpro.svg' %}</button> #}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4.5" width="18" height="15" rx="3"></rect>
    <path d="M14.6 4.5v15"></path>
    <rect class="cp-panel-slab" x="16.2" y="7.5" width="2.6" height="9" rx="1.3" fill="currentColor" stroke="none"></rect>
</svg>
